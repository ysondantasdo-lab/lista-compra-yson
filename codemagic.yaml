workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "br.com.yson.listacompras"
      node: latest
    scripts:
      - name: Configurar e Compilar Projeto
        script: |
          # Cria as chaves do SDK do Android na máquina virtual
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Compila o seu aplicativo gerando o pacote otimizado para a Play Store
          ./gradlew bundleRelease
    artifacts:
      - "**/build/outputs/bundle/**/*.aab"
          

